[project]
name = "de12-scraper-en-profondeur"
version = "0.1.0"
description = "Scraper pedagogique du site Books to Scrape avec Scrapy, PostgreSQL, Docker et UV."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2.9",
    "scrapy>=2.13.3",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
