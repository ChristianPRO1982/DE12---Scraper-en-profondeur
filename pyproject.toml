[project]
name = "de12-scraper-en-profondeur"
version = "0.1.0"
description = "Scraper pedagogique du site Books to Scrape avec Scrapy, PostgreSQL, Docker et UV."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2.9",
    "scrapy>=2.13.3",
]

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "pytest>=9.1.1",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["books_catalog_scraper"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
